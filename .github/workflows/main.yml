name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # On définit le dossier de travail par défaut pour toutes les étapes 'run'
    defaults:
      run:
        working-directory: open-education-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: open-education-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Remplacez 'open-education-frontend' si le nom du projet dans votre angular.json est différent
        run: npm run build -- --configuration production --base-href /open-education/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Attention : le chemin de l'artefact repart de la RACINE du dépôt
          path: ./open-education-frontend/dist/open-education-frontend/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
