<mat-card class="projects-card" appearance="outlined">
	<mat-card-header>
		<mat-card-title>
			<h2>{{title()}}</h2>
		</mat-card-title>

		@if(subtitle()) {
		<mat-card-subtitle>
			<h4>{{subtitle()}}</h4>
		</mat-card-subtitle>
		}

	</mat-card-header>

	<mat-card-content>
		<ng-content></ng-content>
	</mat-card-content>
</mat-card>
