  <nz-card style="width: 100%">
    <div nz-card-grid style="width: 50%; text-align: center">

        [nzCover]="coverTemplate"

    </div>
    <div nz-card-grid style="width: 50%; text-align: center">

          nzTitle="Communication efficace"
          nzDescription="Améliorer les relations et la confiance grâce à des techniques sociales et l'IA comme facilitateur"
        />

    </div>
    <div nz-card-grid style="width: 100%; text-align: center">

        style="width: 100%"
        [nzCover]="coverTemplate"

        nzSize="small"

          nzDescription="Améliorer les relations et la confiance grâce à des techniques sociales et l'IA comme facilitateur"
        />

    </div>
