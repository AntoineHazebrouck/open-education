<nz-layout class="app-layout">
  <nz-header>
    <div class="logo">
      <a>
        <img src="/assets/header-logo.svg" alt="logo" />
      </a>
    </div>
    <ul nz-menu class="top-nav" nzMode="horizontal">
      <li
        nz-menu-item
        routerLinkActive="ant-menu-item-selected"
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Accueil
      </li>
      <li nz-menu-item routerLinkActive="ant-menu-item-selected" routerLink="/about">
        L'association
      </li>
    </ul>
  </nz-header>
  <nz-content>
    <div class="inner-content">
      <router-outlet></router-outlet>
    </div>
  </nz-content>
  <nz-footer>
    <span class="footer-text">© 2026 OPEN EDUCATION</span>
    <span class="spacer"></span>

    <p>TODO facebook etc</p>
  </nz-footer>
</nz-layout>
